name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify release tag matches plugin version
        run: |
          plugin_version="$(python3 -c 'import json; print(json.load(open("plugins/hostplugin/plugin.json"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${plugin_version}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "HostPlugin ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
